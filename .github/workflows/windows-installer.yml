# Construit l'installeur Windows (HOTS-REVIVAL-Setup-x.y.z.exe) et le publie dans les Releases GitHub.
name: Installeur Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests backend (dont conformité Blizzard)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck desktop
        working-directory: apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm run typecheck
      - name: Plateforme communautaire (Worker)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Site communautaire
        working-directory: site
        run: |
          npm ci
          npm run build

  windows:
    needs: tests
    runs-on: windows-latest
    env:
      # Signature SignPath des versions publiques (tags v*), dès que le secret existe (voir docs/signature-du-code.md).
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compiler le moteur d'analyse (PyInstaller)
        working-directory: backend
        run: |
          pip install . pyinstaller
          pyinstaller hots-backend.spec --noconfirm

      - name: Vérifier l'exécutable du moteur
        working-directory: backend
        shell: pwsh
        run: |
          $env:HOTS_DATA_DIR = "$env:RUNNER_TEMP\hots-smoke"
          $p = Start-Process -FilePath "dist\hots-backend\hots-backend.exe" -ArgumentList "--port","8765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-RestMethod "http://127.0.0.1:8765/api/health/replay-parser"
              if ($r.loaded) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) {
            Get-ChildItem "$env:HOTS_DATA_DIR" -Filter *.log | Get-Content
            throw "Le moteur ne répond pas"
          }
          Write-Host "Moteur OK : $($r.protocols) protocoles, build $($r.latest_build)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.2.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Construire l'application
        working-directory: apps/desktop
        run: |
          npm ci
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          npm run build
          npx electron-builder --win --dir --publish never

      # La cible « --dir » n'écrit pas app-update.yml (c'est la cible nsis qui le fait) : sans lui,
      # l'application installée ne trouve plus ses mises à jour (versions 1.1.0 à 1.2.1).
      - name: Configuration des mises à jour
        shell: pwsh
        run: |
          $yml = "owner: BigBlackC0de`nrepo: HOTS-REVIVAL`nprovider: github`nreleaseType: prerelease`nupdaterCacheDirName: hots-revival-desktop-updater`n"
          Set-Content -Path "apps/desktop/release/win-unpacked/resources/app-update.yml" -Value $yml -NoNewline -Encoding utf8NoBOM

      # 1re signature : nos deux exécutables, avant de les emballer dans l'installeur
      - name: Exécutables à signer
        if: env.SIGN == 'true'
        id: exes
        uses: actions/upload-artifact@v4
        with:
          name: executables-a-signer
          path: |
            apps/desktop/release/win-unpacked/HOTS REVIVAL.exe
            apps/desktop/release/win-unpacked/resources/backend/hots-backend.exe
          if-no-files-found: error

      - name: Signer les exécutables (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hots-revival
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/win-unpacked

      - name: Construire l'installeur
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      # 2e signature : l'installeur lui-même
      - name: Installeur à signer
        if: env.SIGN == 'true'
        id: setup
        uses: actions/upload-artifact@v4
        with:
          name: installeur-a-signer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Signer l'installeur (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hots-revival
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release

      - name: Mettre à jour latest.yml après signature
        if: env.SIGN == 'true'
        working-directory: apps/desktop
        run: node scripts/refresh-update-metadata.mjs

      - name: Vérifier la signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe, "apps/desktop/release/win-unpacked/HOTS REVIVAL.exe", apps/desktop/release/win-unpacked/resources/backend/hots-backend.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name) : $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne "Valid") { throw "$($_.Name) n'est pas signé correctement" }
          }

      - name: Vérifier la configuration des mises à jour
        shell: pwsh
        run: |
          $f = "apps/desktop/release/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $f)) { throw "app-update.yml absent : l'application ne trouverait pas ses mises à jour" }
          Get-Content $f

      # Garde-fou : l'installeur est installé pour de vrai, puis l'application installée doit
      # trouver la dernière version publiée. Sinon rien n'est publié (une version incapable de se
      # mettre à jour obligerait chaque joueur à retélécharger l'application à la main).
      - name: Tester la mise à jour de l'application installée
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/HOTS-REVIVAL-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          # L'installeur peut rendre la main avant la fin de la copie : on attend l'exécutable installé.
          $exe = $null
          for ($i = 0; $i -lt 60 -and -not $exe; $i++) {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter "HOTS REVIVAL.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "win-unpacked" } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            throw "Application non installée par $($setup.Name)"
          }
          Write-Host "Application installée : $exe"
          Start-Sleep -Seconds 5  # fin de l'installation (fichiers encore en cours d'écriture)
          Get-Process "HOTS REVIVAL" -ErrorAction SilentlyContinue | Stop-Process -Force
          $out = "$env:RUNNER_TEMP\update-selftest.json"
          $env:HOTS_UPDATE_SELFTEST = $out
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Auto-test de mise à jour : délai dépassé" }
          if (-not (Test-Path $out)) { throw "Auto-test de mise à jour : aucun résultat" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "Version installée $($r.current), dernière version trouvée : $($r.latest) $($r.error)"
          if (-not $r.ok) { throw "L'application installée ne trouve pas ses mises à jour : $($r.error)" }

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: HOTS-REVIVAL-Setup
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      # Versions publiques uniquement (tags v*) : un build de branche publié en pré-version après une
      # version publique masquait celle-ci aux applications installées (« pas de mise à jour »).
      - name: Publier dans les Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HOTS REVIVAL ${{ steps.version.outputs.tag }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          body: |
            ## Installation
            1. Téléchargez **HOTS-REVIVAL-Setup-*.exe** ci-dessous.
            2. Double-cliquez dessus : l'application s'installe et se lance toute seule.
            3. Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur **Informations complémentaires** puis **Exécuter quand même** (chaque nouvelle version doit d'abord se faire connaître de Windows).

            Déjà installé ? Utilisez simplement le bouton « Mettre à jour » de l'application.

            Vos replays sont détectés et analysés automatiquement. Lancez Heroes of the Storm en **plein écran fenêtré** pour voir l'overlay.

            **Statistiques communautaires** : par défaut, l'application partage un résumé de vos parties (héros, carte, résultat, talents, statistiques ; jamais le replay, le chat ni les pseudos) pour alimenter https://hots-revival.pages.dev. Un bandeau vous prévient au premier lancement, avant tout envoi, et vous pouvez le désactiver d'un clic (ou plus tard dans Paramètres → Communauté). Le profil public reste désactivé tant que vous ne l'activez pas.
