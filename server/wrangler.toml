name = "hots-revival-community"
main = "src/index.ts"
workers_dev = true
compatibility_date = "2025-09-01"

# Agrégation des nouvelles parties une fois par jour (03:17 UTC) : chaque ligne de statistiques
# n'est réécrite qu'une fois, au lieu de 24 (limite d'écritures du plan gratuit D1).
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hots-community"
# Identifiant de la base (non secret), créé par `npx wrangler d1 create hots-community`.
database_id = "7bf48328-ddd6-4f02-a15b-069d8fd5e4a6"
migrations_dir = "migrations"
